services:
  manga:
    # Kept as a plain build so older Docker Compose versions (which don't
    # support build.provenance) can still build the project.
    build: .
    init: true
    stdin_open: true
    tty: true

    # The entrypoint runs as root only long enough to switch to the owner of
    # the bind-mounted project, so no MANGA_UID/MANGA_GID setup is normally
    # required. Set them to override the detected owner.
    environment:
      MANGA_HOME: /app
      CHROMIUM_PATH: /usr/bin/chromium
      FERRUM_CHROME_DOCKERIZE: "true"
      MANGA_PAGE_TIMEOUT: "${MANGA_PAGE_TIMEOUT:-90}"
      MANGA_PROTOCOL_TIMEOUT: "${MANGA_PROTOCOL_TIMEOUT:-180}"
      MANGA_CHAPTER_RETRIES: "${MANGA_CHAPTER_RETRIES:-1}"
      MANGA_DAILY_LIMIT: "${MANGA_DAILY_LIMIT:-300}"
      MANGA_IMAGE_THREADS: "${MANGA_IMAGE_THREADS:-10}"
      MANGA_HTTP_OPEN_TIMEOUT: "${MANGA_HTTP_OPEN_TIMEOUT:-60}"
      MANGA_HTTP_READ_TIMEOUT: "${MANGA_HTTP_READ_TIMEOUT:-60}"
      MANGA_HTTP_RETRIES: "${MANGA_HTTP_RETRIES:-3}"
      HOME: /tmp

    volumes:
      # The whole project is mounted so the menu, saved lists, downloads and
      # logs all use the same files as the non-Docker setup.
      - .:/app
